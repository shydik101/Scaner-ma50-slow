name: Hybrid Scan V10.1 Bintang 5

on:
  schedule:
    - cron: '10 9 * * 1-5'
    - cron: '50 7 * * 1-5'
    - cron: '30 2 * * 5'
  workflow_dispatch:

jobs:
  scan-buy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - file: tickers-batch1.txt
            label: BUY BIGCAPS
          - file: tickers-batch2.txt
            label: BUY GORENGAN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas
      
      - name: Cek Jadwal - BUY hanya jam 16:10 WIB
        id: check_buy
        run: |
          HOUR=$(date -u +%H%M)
          SCHED="${{ github.event.schedule }}"
          echo "Jam UTC sekarang: $HOUR, Schedule trigger: $SCHED"
          # Jika manual dispatch, selalu jalan
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          # Jika cron BUY
          elif [ "$SCHED" == "10 9 * * 1-5" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Hybrid Scan Bintang 5
        if: steps.check_buy.outputs.run == 'true'
        run: python scan.py
        env:
          TICKER_FILE: ${{ matrix.file }}
          BATCH_LABEL: ${{ matrix.label }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save history
        if: always() && steps.check_buy.outputs.run == 'true'
        run: |
          git config user.name "scan-bot"
          git config user.email "bot@github.com"
          git pull --rebase origin main || true
          git add history.json -f || true
          git diff --staged --quiet || git commit -m "history ${{ matrix.label }} $(date +%Y-%m-%d_%H:%M)"
          git push || true

  scan-exit-gorengan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas
      - name: Cek Jadwal - EXIT GORENGAN 14:50 WIB
        id: check
        run: |
          if [ "${{ github.event.schedule }}" == "50 7 * * 1-5" ]; then echo "run=true" >> $GITHUB_OUTPUT; else echo "run=false" >> $GITHUB_OUTPUT; fi
      - name: Run Exit Gorengan
        if: steps.check.outputs.run == 'true'
        run: python scan_exit.py
        env:
          TICKER_FILE: tickers-batch2.txt
          BATCH_LABEL: EXIT GORENGAN
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

  scan-exit-bigcaps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas
      - name: Cek Jadwal - EXIT BIGCAPS Jumat 09:30 WIB
        id: check
        run: |
          if [ "${{ github.event.schedule }}" == "30 2 * * 5" ]; then echo "run=true" >> $GITHUB_OUTPUT; else echo "run=false" >> $GITHUB_OUTPUT; fi
      - name: Run Exit Bigcaps
        if: steps.check.outputs.run == 'true'
        run: python scan_exit.py
        env:
          TICKER_FILE: tickers-batch1.txt
          BATCH_LABEL: EXIT BIGCAPS
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
