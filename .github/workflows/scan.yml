name: Scanner V7.0 5JT

on:
  schedule:
    - cron: '10 8 * * 1-5'   # Auto jam 15:10 WIB (08:10 UTC) Senin-Jumat
  workflow_dispatch:          # Biar bisa di-Run manual dari HP

jobs:
  scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Batch 1 - Big Cap (15:10 WIB)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TICKER_FILE: tickers-batch1.txt
          BATCH_LABEL: BATCH 1/2 BIG CAP
        run: |
          echo "=== RUN BATCH 1 ==="
          echo "Key exists: $(if [ -n "$TWELVEDATA_API_KEY" ]; then echo YES; else echo NO; fi)"
          python scan.py

      - name: Cooldown 15 menit
        run: |
          echo "Cooldown 15 menit biar API gak limit..."
          sleep 60

      - name: Batch 2 - Gorengan Tren (15:25 WIB)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TICKER_FILE: tickers-batch2.txt
          BATCH_LABEL: BATCH 2/2 GORENGAN
        run: |
          echo "=== RUN BATCH 2 ==="
          python scan.py
