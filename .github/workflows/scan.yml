name: Stock Scan Full IDX + US - V11.8.1 Watchlist

on:
  schedule:
    - cron: '15 2 * * 1-5'   # 09:15 WIB Watchlist
    - cron: '50 7 * * 1-5'   # 14:50 WIB Gorengan
    - cron: '10 9 * * 1-5'   # 16:10 WIB Bigcaps+US
    - cron: '15 9 * * 1-5'   # 16:15 WIB Exit
  workflow_dispatch:
    inputs:
      jobs_to_run:
        description: 'Jobs: watchlist,gorengan,bigs,us,exit'
        default: 'all'

jobs:
  scan-watchlist:
    name: 👁️ Watchlist BMRI - 09:15 WIB
    if: github.event.schedule != '' || contains(github.event.inputs.jobs_to_run, 'watchlist') || github.event.inputs.jobs_to_run == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - name: Run Watchlist
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TICKER_FILE: tickers-watchlist.txt
          BATCH_LABEL: WATCHLIST-BMRI
        run: python scan_watchlist.py

  scan-gorengan:
    name: 🔴 Gorengan - 14:50 WIB
    needs: [scan-watchlist]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - name: Run Gorengan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TICKER_FILE: tickers-batch2.txt
          BATCH_LABEL: GORENGAN-14:50
        run: python scan.py

  scan-bigs:
    name: 🔵 Bigcaps IDX - 16:10 WIB
    needs: [scan-gorengan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - name: Run Bigcaps
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TICKER_FILE: tickers-batch1.txt
          BATCH_LABEL: BIGCAPS-16:10
        run: python scan.py

  scan-us:
    name: 🇺🇸 US ETF - 16:10 WIB
    needs: [scan-gorengan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - name: Run US
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TICKER_FILE: tickers-etf-us.txt
          MARKET: US
          BATCH_LABEL: US-ETF-16:10
        run: python scan.py

  scan-exit:
    name: 🚪 Exit - 16:15 WIB
    needs: [scan-bigs, scan-us]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - name: Run Exit
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scan_exit.py
