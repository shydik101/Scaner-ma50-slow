jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Batch 1 - Big Cap (15:10 WIB)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TICKER_FILE: tickers-batch1.txt
          BATCH_LABEL: BATCH 1/2 BIG CAP
        run: python scan.py
      - name: Cooldown 15 menit
        run: |
          echo "Cooldown 15 menit biar Yahoo gak blokir..."
          sleep 900
      - name: Batch 2 - Gorengan Tren (15:25 WIB)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TICKER_FILE: tickers-batch2.txt
          BATCH_LABEL: BATCH 2/2 GORENGAN
        run: python scan.py
