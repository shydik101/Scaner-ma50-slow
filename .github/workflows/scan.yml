name: Scan MA50 Daily
on:
  schedule:
    - cron: '5 9 * * 1-5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lib
        run: pip install yfinance requests
      - name: Run full scan
        run: python scan.py
