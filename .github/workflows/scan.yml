name: Hybrid Scan V11.2 PRO FIX

on:
  schedule:
    - cron: '10 9 * * 1-5'   # BUY IDX 16:10 WIB
    - cron: '50 7 * * 1-5'   # EXIT GORENGAN 14:50 WIB
    - cron: '30 2 * * 5'     # EXIT BIGCAPS Jumat 09:30 WIB
    - cron: '0 22 * * 1-5'   # US ETF 05:00 WIB
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-buy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas
      
      - name: Cek Jadwal - BUY IDX hanya jam 16:10 WIB
        id: check_buy
        run: |
          SCHED="${{ github.event.schedule }}"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          elif [ "$SCHED" == "10 9 * * 1-5" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi

      # FIX: Jalanin batch1 & batch2 dalam 1 job biar history nggak ketimpa
      - name: Run Hybrid Scan BIGCAPS + GORENGAN
        if: steps.check_buy.outputs.run == 'true'
        run: |
          python scan.py --market IDX --ticker_file tickers-batch1.txt
          sleep 5
          python scan.py --market IDX --ticker_file tickers-batch2.txt
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save history IDX (MERGED)
        if: always() && steps.check_buy.outputs.run == 'true'
        run: |
          git config user.name "scan-bot"
          git config user.email "bot@github.com"
          git pull --rebase origin main || true
          git add history.json -f || true
          git diff --staged --quiet || git commit -m "history IDX $(date +%Y-%m-%d_%H:%M) [skip ci]"
          git push || true

  scan-exit-gorengan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests pandas
      - name: Cek Jadwal
        id: check
        run: |
          if [ "${{ github.event.schedule }}" == "50 7 * * 1-5" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then echo "run=true" >> $GITHUB_OUTPUT; else echo "run=false" >> $GITHUB_OUTPUT; fi
      - name: Run Exit Gorengan
        if: steps.check.outputs.run == 'true'
        run: python scan_exit.py --market IDX --ticker_file tickers-batch2.txt
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

  scan-exit-bigcaps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests pandas
      - name: Cek Jadwal
        id: check
        run: |
          if [ "${{ github.event.schedule }}" == "30 2 * * 5" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then echo "run=true" >> $GITHUB_OUTPUT; else echo "run=false" >> $GITHUB_OUTPUT; fi
      - name: Run Exit Bigcaps
        if: steps.check.outputs.run == 'true'
        run: python scan_exit.py --market IDX --ticker_file tickers-batch1.txt
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

  scan-us-etf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests pandas
      - name: Cek Jadwal US ETF
        id: check_us
        run: |
          SCHED="${{ github.event.schedule }}"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then echo "run=true" >> $GITHUB_OUTPUT
          elif [ "$SCHED" == "0 22 * * 1-5" ]; then echo "run=true" >> $GITHUB_OUTPUT
          else echo "run=false" >> $GITHUB_OUTPUT; fi
      - name: Run BUY + EXIT US ETF
        if: steps.check_us.outputs.run == 'true'
        run: |
          python scan.py --market US --ticker_file tickers_etf_us.txt
          python scan_exit.py --market US --ticker_file tickers_etf_us.txt
        env:
          MARKET: US
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save history ETF
        if: always() && steps.check_us.outputs.run == 'true'
        run: |
          git config user.name "scan-bot"
          git config user.email "bot@github.com"
          git pull --rebase origin main || true
          git add history_etf.json -f || true
          git diff --staged --quiet || git commit -m "history ETF $(date +%Y-%m-%d_%H:%M) [skip ci]"
          git push || true
