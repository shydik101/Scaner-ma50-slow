name: Scan Sultan V6.3c Batch 15 Menit

on:
  schedule:
    - cron: '10 8 * * 1-5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install deps
        run: pip install yfinance pandas requests numpy pytz

      - name: Batch 1 - Big Cap (15:10 WIB)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TICKER_FILE: tickers-batch1.txt
          BATCH_LABEL: BATCH 1/2 BIG CAP
        run: python scan.py

      - name: Cooldown 15 menit
        run: |
          echo "Cooldown 15 menit biar Yahoo gak blokir..."
          sleep 900

      - name: Batch 2 - Gorengan Tren (15:25 WIB)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TICKER_FILE: tickers-batch2.txt
          BATCH_LABEL: BATCH 2/2 GORENGAN
        run: python scan.py
