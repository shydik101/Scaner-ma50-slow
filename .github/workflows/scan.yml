name: Scan Saham V9.2

permissions:
  contents: write

on:
  schedule:
    - cron: '10 9 * * 1-5'  # 16:10 WIB - BUY Batch 1 & 2
    - cron: '50 7 * * 1-5'  # 14:50 WIB - EXIT Gorengan Harian
    - cron: '30 2 * * 5'    # 09:30 WIB Jumat - EXIT Big Cap Mingguan
  workflow_dispatch:

jobs:
  buy-scan:
    if: github.event.schedule == '10 9 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: pip install pandas requests yfinance
      - name: BUY Batch 1 - Big Caps
        run: |
          echo "=== DEBUG BATCH 1 ==="
          ls -la
          echo "--- cek file ---"
          cat tickers-batch1.txt || echo "FILE tickers-batch1.txt TIDAK ADA!"
          wc -l tickers-batch1.txt
          echo "--- jalanin scan ---"
          python -u scan.py
        env:
          TICKER_FILE: tickers-batch1.txt
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save Holdings Batch 1
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@github.com"
          git pull --rebase || true
          git add my_holdings.json || true
          git commit -m "update holdings batch1 $(date)" || echo "no changes to commit"
          git push || true
      - name: BUY Batch 2 - Gorengan
        run: |
          echo "=== DEBUG BATCH 2 ==="
          cat tickers-batch2.txt || echo "FILE tickers-batch2.txt TIDAK ADA!"
          wc -l tickers-batch2.txt
          python -u scan.py
        env:
          TICKER_FILE: tickers-batch2.txt
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save Holdings Batch 2
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@github.com"
          git pull --rebase || true
          git add my_holdings.json || true
          git commit -m "update holdings batch2 $(date)" || echo "no changes to commit"
          git push || true

  exit-gorengan:
    if: github.event.schedule == '50 7 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pandas requests yfinance
      - name: EXIT Gorengan Daily 14:50 WIB
        run: python scan_exit.py --tipe GORENGAN
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

  exit-bigcap:
    if: github.event.schedule == '30 2 * * 5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pandas requests yfinance
      - name: EXIT Big Cap Jumat 09:30 WIB
        run: python scan_exit.py --tipe BIGCAP
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
