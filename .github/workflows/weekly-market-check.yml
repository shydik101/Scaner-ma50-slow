name: Weekly Market Check (QQQ + IDX)

on:
  schedule:
    - cron: '0 0 * * 0' # Otomatis Minggu 07:00 WIB
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode laporan'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - test_telegram

jobs:
  weekly-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests pandas
      - name: Run weekly check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKER_URL: https://yahoo-proxy.rizalmawardi766.workers.dev
          MODE: ${{ inputs.mode }}
        run: python tools/weekly_market_check.py
